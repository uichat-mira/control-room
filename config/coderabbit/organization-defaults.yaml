# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# Mira organization-level CodeRabbit defaults.
# Source of truth: Control Room.
#
# These are soft defaults only. Repositories may override them when their
# implementation context genuinely differs.
language: "zh-CN"
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true

chat:
  auto_reply: true
