# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# Mira organization-level CodeRabbit operational defaults.
# Source of truth for these soft defaults: Control Room.
# Organization review governance and the CodeRabbit provider boundary remain owned by
# uichat-mira/.github/ai-review/providers/coderabbit.md.
#
# These are soft defaults only. Repositories may override them when their
# implementation context genuinely differs.
language: "zh-CN"
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true

chat:
  auto_reply: true
