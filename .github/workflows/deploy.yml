name: Control Room CI / Deploy

on:
  push:
    branches:
      - prod
  pull_request:
    branches:
      - prod
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-room-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  deploy:
    name: Deploy
    needs: verify
    if: github.event_name != 'pull_request' && github.ref_name == 'prod'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_READ_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
      CONTROL_ROOM_URL: https://uichat-mira-control-room.dangjingtao.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Validate Cloudflare deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Prepare runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "EXPECT_CF_READ=0" >> "$GITHUB_ENV"

          if [ -n "${CLOUDFLARE_READ_TOKEN:-}" ]; then
            umask 077
            printf 'CLOUDFLARE_READ_TOKEN=%s\n' "$CLOUDFLARE_READ_TOKEN" > /tmp/control-room-secrets.env
            echo "EXPECT_CF_READ=1" >> "$GITHUB_ENV"
          fi

      - name: Deploy to Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npm run build

          args=(
            --var "CLOUDFLARE_ACCOUNT_ID:${CLOUDFLARE_ACCOUNT_ID}"
            --var "DEPLOYED_COMMIT:${GITHUB_SHA}"
          )

          if [ -f /tmp/control-room-secrets.env ]; then
            args+=(--secrets-file /tmp/control-room-secrets.env)
          fi

          npx wrangler deploy "${args[@]}"
          rm -f /tmp/control-room-secrets.env

      - name: Smoke test deployed API
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --retry 8 --retry-delay 2 --retry-all-errors \
            "${CONTROL_ROOM_URL}/api/health" --output /tmp/control-room-health.json
          curl --fail --silent --show-error --retry 8 --retry-delay 2 --retry-all-errors \
            "${CONTROL_ROOM_URL}/api/summary" --output /tmp/control-room-summary.json

          cat /tmp/control-room-health.json
          cat /tmp/control-room-summary.json
          node <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('/tmp/control-room-health.json', 'utf8'));
          const summary = JSON.parse(fs.readFileSync('/tmp/control-room-summary.json', 'utf8'));

          if (health.ok !== true || health.service !== 'mira-control-room') {
            throw new Error('Unexpected Control Room health response');
          }
          if (health.commit && health.commit !== process.env.GITHUB_SHA) {
            throw new Error(`Unexpected deployed commit: ${health.commit}`);
          }
          if (!summary.sources || !['connected', 'degraded'].includes(summary.sources.github)) {
            throw new Error(`Unexpected GitHub source state: ${summary.sources?.github}`);
          }
          if (!Array.isArray(summary.repositories)) {
            throw new Error('Control Room repositories payload is invalid');
          }
          if (!Array.isArray(summary.services) || summary.services.length < 1) {
            throw new Error('Control Room returned no service probes');
          }
          if (!summary.cloudflare || !Array.isArray(summary.cloudflare.workers) || !Array.isArray(summary.cloudflare.pages)) {
            throw new Error('Control Room Cloudflare payload is invalid');
          }
          if (process.env.EXPECT_CF_READ === '1' && summary.sources.cloudflare === 'unconfigured') {
            throw new Error('Cloudflare read token was supplied but runtime reports unconfigured');
          }

          console.log(
            `Smoke OK: ${summary.repositories.length} repos, ${summary.services.length} services, GitHub=${summary.sources.github}, CF=${summary.sources.cloudflare}`,
          );
          NODE

      - name: Show deployed versions
        run: npx wrangler deployments list
