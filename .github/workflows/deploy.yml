name: Control Room CI / Deploy

on:
  push:
    branches:
      - prod
  pull_request:
    branches:
      - prod
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-room-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  deploy:
    name: Deploy
    needs: verify
    if: github.event_name != 'pull_request' && github.ref_name == 'prod'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ORG_GITHUB_TOKEN: ${{ secrets.ORG_GITHUB_TOKEN }}
      AI_REVIEW_GATEWAY_TOKEN: ${{ secrets.AI_REVIEW_GATEWAY_TOKEN }}
      CONTROL_ROOM_URL: https://uichat-mira-control-room.dangjingtao.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${AI_REVIEW_GATEWAY_TOKEN:-}"

      - name: Guard current prod head
        id: deploy_guard
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_sha="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_API_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/prod" \
            | node -e "let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).object.sha))"
          )"

          if [ "$latest_sha" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Current run still owns prod HEAD."
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale deploy: run=${GITHUB_SHA}, prod=${latest_sha}"
          fi

      - name: Prepare runtime configuration
        if: steps.deploy_guard.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf 'CLOUDFLARE_READ_TOKEN=%s\n' "$CLOUDFLARE_API_TOKEN" > /tmp/control-room-secrets.env
          printf 'AI_REVIEW_GATEWAY_TOKEN=%s\n' "$AI_REVIEW_GATEWAY_TOKEN" >> /tmp/control-room-secrets.env
          if [ -n "${ORG_GITHUB_TOKEN:-}" ]; then
            printf 'GITHUB_READ_TOKEN=%s\n' "$ORG_GITHUB_TOKEN" >> /tmp/control-room-secrets.env
          fi

      - name: Deploy to Cloudflare
        if: steps.deploy_guard.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy \
            --var "CLOUDFLARE_ACCOUNT_ID:${CLOUDFLARE_ACCOUNT_ID}" \
            --var "DEPLOYED_COMMIT:${GITHUB_SHA}" \
            --secrets-file /tmp/control-room-secrets.env

          rm -f /tmp/control-room-secrets.env

      - name: Smoke test deployed API
        if: steps.deploy_guard.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              "${CONTROL_ROOM_URL}/api/v1/health" --output /tmp/control-room-health.json; then
              if node <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('/tmp/control-room-health.json', 'utf8'));
          process.exit(
            health.apiVersion === 'v1' &&
            health.ok === true &&
            health.service === 'mira-control-room' &&
            health.commit === process.env.GITHUB_SHA ? 0 : 1
          );
          NODE
              then
                ready=1
                break
              fi
            fi
            echo "Waiting for Worker commit ${GITHUB_SHA} (attempt ${attempt}/30)..."
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "Expected Worker commit did not become active in time."
            cat /tmp/control-room-health.json || true
            exit 1
          fi

          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
            "${CONTROL_ROOM_URL}/api/v1/summary" --output /tmp/control-room-summary.json
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
            "${CONTROL_ROOM_URL}/api/v1/governance" --output /tmp/control-room-governance.json
          curl --fail --silent --show-error --retry 3 --retry-delay 1 --retry-all-errors \
            "${CONTROL_ROOM_URL}/openapi.json" --output /tmp/control-room-openapi.json
          curl --fail --silent --show-error --retry 3 --retry-delay 1 --retry-all-errors \
            "${CONTROL_ROOM_URL}/docs" --output /tmp/control-room-docs.html
          curl --fail --silent --show-error --retry 3 --retry-delay 1 --retry-all-errors \
            "${CONTROL_ROOM_URL}/api/v1/repos" --output /tmp/control-room-repos.json
          curl --fail --silent --show-error --retry 3 --retry-delay 1 --retry-all-errors \
            "${CONTROL_ROOM_URL}/api/v1/deployments" --output /tmp/control-room-deployments.json
          curl --fail --silent --show-error --retry 3 --retry-delay 1 --retry-all-errors \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -H "MCP-Protocol-Version: 2026-07-28" \
            -H "Mcp-Method: tools/list" \
            --data '{"jsonrpc":"2.0","id":"smoke-list","method":"tools/list","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{},"io.modelcontextprotocol/clientInfo":{"name":"control-room-ci","version":"1.0.0"}}}}' \
            "${CONTROL_ROOM_URL}/mcp" --output /tmp/control-room-mcp-list.json
          curl --fail --silent --show-error --retry 3 --retry-delay 1 --retry-all-errors \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -H "MCP-Protocol-Version: 2026-07-28" \
            -H "Mcp-Method: tools/call" \
            -H "Mcp-Name: inspect_engineering" \
            --data '{"jsonrpc":"2.0","id":"smoke-call","method":"tools/call","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{},"io.modelcontextprotocol/clientInfo":{"name":"control-room-ci","version":"1.0.0"}},"name":"inspect_engineering","arguments":{"view":"repositories"}}}' \
            "${CONTROL_ROOM_URL}/mcp" --output /tmp/control-room-mcp-call.json

          cat /tmp/control-room-health.json
          node <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('/tmp/control-room-health.json', 'utf8'));
          const summary = JSON.parse(fs.readFileSync('/tmp/control-room-summary.json', 'utf8'));
          const governance = JSON.parse(fs.readFileSync('/tmp/control-room-governance.json', 'utf8'));
          const openapi = JSON.parse(fs.readFileSync('/tmp/control-room-openapi.json', 'utf8'));
          const repos = JSON.parse(fs.readFileSync('/tmp/control-room-repos.json', 'utf8'));
          const deployments = JSON.parse(fs.readFileSync('/tmp/control-room-deployments.json', 'utf8'));
          const mcpList = JSON.parse(fs.readFileSync('/tmp/control-room-mcp-list.json', 'utf8'));
          const mcpCall = JSON.parse(fs.readFileSync('/tmp/control-room-mcp-call.json', 'utf8'));
          const docs = fs.readFileSync('/tmp/control-room-docs.html', 'utf8');

          console.log(
            `GitHub smoke: status=${summary.sources?.github ?? 'missing'}, repos=${summary.repositories?.length ?? 0}, error=${summary.error ?? 'none'}, governance=${governance.github?.governanceStatus ?? 'missing'}, governanceRepos=${governance.repositories?.length ?? 0}, projects=${governance.github?.projects?.status ?? 'missing'}`,
          );

          if (health.apiVersion !== 'v1' || summary.apiVersion !== 'v1' || governance.apiVersion !== 'v1') {
            throw new Error('Public API v1 marker is missing');
          }
          if (openapi.openapi !== '3.1.0' || openapi.info?.version !== '1.0.0') {
            throw new Error('OpenAPI contract is invalid');
          }
          if (!docs.includes('<div id="root"></div>')) {
            throw new Error('Human documentation route did not return the SPA shell');
          }
          if (health.ok !== true || health.service !== 'mira-control-room') {
            throw new Error('Unexpected Control Room health response');
          }
          if (health.commit !== process.env.GITHUB_SHA) {
            throw new Error(`Unexpected deployed commit: ${health.commit}`);
          }
          if (health.githubAuth !== 'authenticated') {
            throw new Error(`Expected authenticated GitHub reads, got: ${health.githubAuth}`);
          }
          if (!summary.sources || summary.sources.github !== 'connected') {
            throw new Error(`Unexpected GitHub source state: ${summary.sources?.github}`);
          }
          if (!Array.isArray(summary.repositories) || summary.repositories.length < 1) {
            throw new Error('Control Room repositories payload is invalid');
          }
          if (!Array.isArray(summary.services) || summary.services.length < 1) {
            throw new Error('Control Room returned no service probes');
          }
          if (!summary.cloudflare || !Array.isArray(summary.cloudflare.workers) || !Array.isArray(summary.cloudflare.pages)) {
            throw new Error('Control Room Cloudflare payload is invalid');
          }
          if (summary.sources.cloudflare === 'unconfigured') {
            throw new Error('Shared Cloudflare key was supplied but runtime reports unconfigured');
          }
          if (!governance.github || governance.github.authenticated !== true) {
            throw new Error('GitHub governance is not using authenticated reads');
          }
          if (!Array.isArray(governance.repositories) || governance.repositories.length < 1) {
            throw new Error('GitHub governance returned no repository projection');
          }
          const liveRepos = new Set(summary.repositories.map((repo) => repo.fullName));
          if (governance.repositories.some((repo) => !liveRepos.has(repo.fullName))) {
            throw new Error('GitHub governance contains a repository outside the live public roster');
          }
          if (governance.repositories.some((repo) => !repo.governance || !('openIssues' in repo.governance) || !('openPullRequests' in repo.governance))) {
            throw new Error('GitHub governance fields are missing');
          }
          if (!governance.github.projects || !['connected', 'unavailable'].includes(governance.github.projects.status)) {
            throw new Error('GitHub Projects projection is invalid');
          }
          if (repos.apiVersion !== 'v1' || !Array.isArray(repos.items) || repos.items.length < 1) {
            throw new Error('Repository-only endpoint is invalid');
          }
          if (deployments.apiVersion !== 'v1' || !Array.isArray(deployments.workers) || !Array.isArray(deployments.pages)) {
            throw new Error('Deployment-only endpoint is invalid');
          }

          const toolNames = new Set((mcpList.result?.tools ?? []).map((tool) => tool.name));
          for (const tool of ['get_overview', 'inspect_engineering', 'inspect_runtime', 'inspect_governance']) {
            if (!toolNames.has(tool)) throw new Error(`MCP tool missing from tools/list: ${tool}`);
          }
          if (mcpCall.error) {
            throw new Error(`MCP tool call returned JSON-RPC error: ${JSON.stringify(mcpCall.error)}`);
          }
          const mcpPayload = mcpCall.result?.structuredContent;
          if (mcpPayload?.apiVersion !== 'v1' || !Array.isArray(mcpPayload.items) || mcpPayload.items.length < 1) {
            throw new Error('MCP inspect_engineering did not return the repository projection');
          }

          if (governance.repositories.length !== summary.repositories.length) {
            console.log(`Governance roster lag: live=${summary.repositories.length}, governance=${governance.repositories.length}`);
          }
          console.log(
            `Smoke OK: api=v1, docs=ok, MCP=4 tools/call ok, ${summary.repositories.length} repos, ${summary.services.length} services, GitHub=${summary.sources.github}/${health.githubAuth}, Governance=${governance.github.governanceStatus}/${governance.repositories.length}, Projects=${governance.github.projects.status}/${governance.github.projects.items?.length ?? 0}, CF=${summary.sources.cloudflare}, Pages=${summary.cloudflare.pages.length}`,
          );
          NODE

      - name: Show deployed versions
        if: steps.deploy_guard.outputs.deploy == 'true'
        run: npx wrangler deployments list
