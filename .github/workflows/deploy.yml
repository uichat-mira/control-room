name: Control Room CI / Deploy

on:
  push:
    branches:
      - prod
  pull_request:
    branches:
      - prod
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-room-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  deploy:
    name: Deploy
    needs: verify
    if: github.event_name != 'pull_request' && github.ref_name == 'prod'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONTROL_ROOM_URL: https://uichat-mira-control-room.dangjingtao.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Deploy to Cloudflare
        run: npm run deploy

      - name: Smoke test deployed API
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --retry 8 --retry-delay 2 --retry-all-errors \
            "${CONTROL_ROOM_URL}/api/health" --output /tmp/control-room-health.json
          curl --fail --silent --show-error --retry 8 --retry-delay 2 --retry-all-errors \
            "${CONTROL_ROOM_URL}/api/summary" --output /tmp/control-room-summary.json

          cat /tmp/control-room-health.json
          node <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('/tmp/control-room-health.json', 'utf8'));
          const summary = JSON.parse(fs.readFileSync('/tmp/control-room-summary.json', 'utf8'));

          if (health.ok !== true || health.service !== 'mira-control-room') {
            throw new Error('Unexpected Control Room health response');
          }
          if (summary.sources?.github !== 'connected') {
            throw new Error(`GitHub source is not connected: ${summary.sources?.github}`);
          }
          if (!Array.isArray(summary.repositories) || summary.repositories.length < 1) {
            throw new Error('Control Room returned no repositories');
          }
          if (!Array.isArray(summary.services) || summary.services.length < 1) {
            throw new Error('Control Room returned no service probes');
          }

          console.log(`Smoke OK: ${summary.repositories.length} repos, ${summary.services.length} services`);
          NODE

      - name: Show deployed versions
        run: npx wrangler deployments list
