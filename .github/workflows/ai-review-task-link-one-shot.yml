name: AI Review Task Link One-shot

on:
  push:
    branches:
      - prod
    paths:
      - .github/workflows/ai-review-task-link-one-shot.yml

permissions:
  contents: read

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ORG_GITHUB_TOKEN: ${{ secrets.ORG_GITHUB_TOKEN }}
    steps:
      - name: Link Mobile pilot PR to trusted work item
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ORG_GITHUB_TOKEN:-}"

          node <<'NODE' > /tmp/task-link-request.json
          const payload = {
            query: `mutation MiraReviewTaskLink($issueId: ID!, $pullRequestIds: [ID!]!) {
              addCloseIssueReferences(input: { issueId: $issueId, pullRequestIds: $pullRequestIds }) {
                issue {
                  number
                  closedByPullRequestsReferences(first: 10, userLinkedOnly: true) {
                    nodes { number }
                  }
                }
              }
            }`,
            variables: {
              issueId: "I_kwDOTlflA88AAAABQn7LaA",
              pullRequestIds: ["PR_kwDOTlflA88AAAABDXBL4w"],
            },
          };
          process.stdout.write(JSON.stringify(payload));
          NODE

          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${ORG_GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data @/tmp/task-link-request.json \
            https://api.github.com/graphql \
            --output /tmp/task-link-response.json

          node <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync('/tmp/task-link-response.json', 'utf8'));
          if (result.errors?.length) {
            throw new Error(`GitHub GraphQL task link failed: ${result.errors.map((item) => item.message).join('; ')}`);
          }
          const issue = result.data?.addCloseIssueReferences?.issue;
          const linked = issue?.closedByPullRequestsReferences?.nodes ?? [];
          if (issue?.number !== 109 || !linked.some((pr) => pr.number === 112)) {
            throw new Error('Mobile #112 was not returned as a manual closing reference for Issue #109.');
          }
          console.log('Linked uichat-mira/mira-mobile#112 to trusted work item #109.');
          NODE

          rm -f /tmp/task-link-request.json /tmp/task-link-response.json
