name: AI Review Core Tests

on:
  pull_request:
    branches:
      - prod
    paths:
      - 'src/gateway.ts'
      - 'src/ai-review.ts'
      - 'src/ai-review-execution.ts'
      - 'src/ai-review-package.ts'
      - 'src/ai-review-prompt.ts'
      - 'src/ai-review-provider-*.ts'
      - 'src/ai-review-publication.ts'
      - 'src/ai-review-runtime.ts'
      - 'tests/ai-review-*.test.ts'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/ai-review-runtime-test.yml'
  push:
    branches:
      - prod
    paths:
      - 'src/gateway.ts'
      - 'src/ai-review.ts'
      - 'src/ai-review-execution.ts'
      - 'src/ai-review-package.ts'
      - 'src/ai-review-prompt.ts'
      - 'src/ai-review-provider-*.ts'
      - 'src/ai-review-publication.ts'
      - 'src/ai-review-runtime.ts'
      - 'tests/ai-review-*.test.ts'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/ai-review-runtime-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Run AI Review core contract tests
        run: npm run test:ai-review
