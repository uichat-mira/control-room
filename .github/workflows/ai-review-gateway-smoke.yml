name: AI Review Gateway Smoke

on:
  workflow_run:
    workflows:
      - Control Room CI / Deploy
    types:
      - completed

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      ${{
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'prod' &&
        github.event.workflow_run.conclusion == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      AI_REVIEW_GATEWAY_TOKEN: ${{ secrets.AI_REVIEW_GATEWAY_TOKEN }}
      AI_REVIEW_HEALTH_URL: https://control.mira.tomz.io/api/v1/ai-review/health
      AI_REVIEW_EXECUTION_URL: https://control.mira.tomz.io/api/v1/ai-review/review
    steps:
      - name: Verify deployed AI Review Gateway health
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            "$AI_REVIEW_HEALTH_URL" \
            --output /tmp/ai-review-health.json

          node <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('/tmp/ai-review-health.json', 'utf8'));
          const deployableStates = new Set(['unconfigured', 'configured']);

          if (health.ok !== true) throw new Error('AI Review Gateway health is not ok');
          if (health.service !== 'mira-ai-review-gateway') {
            throw new Error(`Unexpected service: ${health.service}`);
          }
          if (health.runtimeVersion !== 'control-room-ai-review/v0') {
            throw new Error(`Unexpected runtime version: ${health.runtimeVersion}`);
          }
          if (health.packageVersion !== 'mira-ai-review-package/v0') {
            throw new Error(`Unexpected package version: ${health.packageVersion}`);
          }
          if (health.executionVersion !== 'mira-ai-review-execution/v0') {
            throw new Error(`Unexpected execution version: ${health.executionVersion}`);
          }
          if (health.mode !== 'review-execution-unpublished') {
            throw new Error(`Unexpected gateway mode: ${health.mode}`);
          }
          if (health.github !== 'configured') {
            throw new Error(`GitHub read credential is not configured: ${health.github}`);
          }
          if (health.callerAuth !== 'configured') {
            throw new Error(`Purpose-specific AI Review caller auth is not configured: ${health.callerAuth}`);
          }
          if (!health.policyRef) throw new Error('Organization policy ref is missing');
          for (const mode of ['CODE_REVIEW', 'PROMOTION_REVIEW', 'RELEASE_REVIEW']) {
            const route = health.providerRoutes?.[mode];
            if (!route?.routine) throw new Error(`Missing provider route for ${mode}`);
            for (const [role, target] of Object.entries(route)) {
              if (!deployableStates.has(target.state)) {
                throw new Error(`Non-deployable provider route reached production: ${mode}.${role}=${target.state}`);
              }
              if (!target.provider || !target.model || !target.driver) {
                throw new Error(`Incomplete provider route metadata: ${mode}.${role}`);
              }
            }
          }

          const code = health.providerRoutes.CODE_REVIEW;
          console.log(
            `AI Review Gateway smoke OK: runtime=${health.runtimeVersion}, mode=${health.mode}, callerAuth=${health.callerAuth}, CODE_REVIEW routine=${code.routine.provider}/${code.routine.model}:${code.routine.state}, fallback=${code.fallback?.provider}/${code.fallback?.model}:${code.fallback?.state}, escalation=${code.escalation?.provider}/${code.escalation?.model}:${code.escalation?.state}`,
          );
          NODE

      - name: Verify explicit unavailable semantics when CODE_REVIEW providers are unconfigured
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${AI_REVIEW_GATEWAY_TOKEN:-}" ]; then
            echo '::error::AI_REVIEW_GATEWAY_TOKEN is unavailable to AI Review smoke.'
            exit 1
          fi

          if ! node <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('/tmp/ai-review-health.json', 'utf8'));
          const route = health.providerRoutes?.CODE_REVIEW;
          process.exit(
            route?.routine?.state === 'unconfigured' &&
            (!route?.fallback || route.fallback.state === 'unconfigured') ? 0 : 1
          );
          NODE
          then
            echo 'At least one executable CODE_REVIEW provider is configured; skipping no-provider execution smoke to avoid a paid model call.'
            exit 0
          fi

          payload='{"repository":"uichat-mira/mira-mobile","pullRequest":108}'
          status="$(curl --silent --show-error \
            --retry 3 --retry-delay 2 --retry-all-errors \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${AI_REVIEW_GATEWAY_TOKEN}" \
            --data "$payload" \
            --output /tmp/ai-review-execution.json \
            --write-out '%{http_code}' \
            "$AI_REVIEW_EXECUTION_URL")"

          if [ "$status" != '503' ]; then
            echo "::error::Expected no-provider review execution to return HTTP 503, got ${status}."
            cat /tmp/ai-review-execution.json || true
            exit 1
          fi

          node <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync('/tmp/ai-review-execution.json', 'utf8'));
          if (result.executionVersion !== 'mira-ai-review-execution/v0') {
            throw new Error(`Unexpected executionVersion: ${result.executionVersion}`);
          }
          if (result.identity?.repository !== 'uichat-mira/mira-mobile' || result.identity?.pullRequest !== 108) {
            throw new Error(`Unexpected review identity: ${JSON.stringify(result.identity)}`);
          }
          if (result.execution?.state !== 'REVIEW_UNAVAILABLE') {
            throw new Error(`Expected REVIEW_UNAVAILABLE, got ${result.execution?.state}`);
          }
          if (result.execution?.reason !== 'no_eligible_provider') {
            throw new Error(`Expected no_eligible_provider, got ${result.execution?.reason}`);
          }
          if (!Array.isArray(result.execution?.attempts) || result.execution.attempts.length !== 0) {
            throw new Error('No-provider execution must not contain provider attempts');
          }
          if (result.providerRoute?.routine?.state !== 'unconfigured') {
            throw new Error(`Expected unconfigured routine route, got ${result.providerRoute?.routine?.state}`);
          }
          console.log(
            `AI Review no-provider smoke OK: repo=${result.identity.repository}#${result.identity.pullRequest}, head=${result.identity.headSha}, routine=${result.providerRoute.routine.provider}/${result.providerRoute.routine.model}, state=${result.execution.state}`,
          );
          NODE
