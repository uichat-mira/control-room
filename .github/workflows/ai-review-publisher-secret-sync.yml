name: AI Review Publisher Secret Sync

on:
  workflow_run:
    workflows:
      - Control Room CI / Deploy
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'prod')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ORG_GITHUB_TOKEN: ${{ secrets.ORG_GITHUB_TOKEN }}
      AI_REVIEW_GATEWAY_TOKEN: ${{ secrets.AI_REVIEW_GATEWAY_TOKEN }}
      AI_REVIEW_EXTERNAL_RESULT_TOKEN: ${{ secrets.AI_REVIEW_EXTERNAL_RESULT_TOKEN }}
      AI_PROVIDER_OPENCODE_GO_KEY: ${{ secrets.AI_PROVIDER_OPENCODE_GO_KEY }}
      GH_TOKEN: ${{ secrets.ORG_GITHUB_TOKEN }}
    steps:
      - name: Checkout trusted prod
        uses: actions/checkout@v4
        with:
          ref: prod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Sync Worker publisher secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${ORG_GITHUB_TOKEN:-}"

          printf '%s' "$ORG_GITHUB_TOKEN" \
            | npx wrangler secret put GITHUB_PUBLISH_TOKEN \
                --name uichat-mira-control-room

      - name: Sync pilot caller secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AI_REVIEW_GATEWAY_TOKEN:-}"
          test -n "${GH_TOKEN:-}"

          for repository in \
            uichat-mira/mira-mobile \
            uichat-mira/uichat-mira-docs \
            uichat-mira/mira-desktop
          do
            gh secret set AI_REVIEW_GATEWAY_TOKEN \
              --repo "$repository" \
              --app actions \
              --body "$AI_REVIEW_GATEWAY_TOKEN"
          done

          echo 'Pilot caller secrets synchronized.'

      - name: Sync Desktop OpenCode review secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${GH_TOKEN:-}"
          test -n "${AI_PROVIDER_OPENCODE_GO_KEY:-}"

          external_result_token="${AI_REVIEW_EXTERNAL_RESULT_TOKEN:-}"
          if [ -z "$external_result_token" ]; then
            external_result_token="$(openssl rand -hex 32)"
            echo "::add-mask::$external_result_token"
            gh secret set AI_REVIEW_EXTERNAL_RESULT_TOKEN               --repo uichat-mira/control-room               --app actions               --body "$external_result_token"
            echo 'Created the purpose-specific external result credential in Control Room.'
          fi

          printf '%s' "$external_result_token"             | npx wrangler secret put AI_REVIEW_EXTERNAL_RESULT_TOKEN                 --name uichat-mira-control-room

          gh secret set AI_REVIEW_EXTERNAL_RESULT_TOKEN             --repo uichat-mira/mira-desktop             --app actions             --body "$external_result_token"

          gh secret set AI_PROVIDER_OPENCODE_GO_KEY             --repo uichat-mira/mira-desktop             --app actions             --body "$AI_PROVIDER_OPENCODE_GO_KEY"

          echo 'Desktop OpenCode review secrets synchronized.'

      - name: Verify publisher health
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error \
              https://uichat-mira-control-room.dangjingtao.workers.dev/api/v1/ai-review/health \
              --output /tmp/ai-review-health.json; then
              if node <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('/tmp/ai-review-health.json', 'utf8'));
          const expectedRepositories = [
            'uichat-mira/mira-mobile',
            'uichat-mira/uichat-mira-docs',
            'uichat-mira/mira-desktop',
          ];
          process.exit(
            health.publisherAuth === 'configured' &&
            health.callerAuth === 'configured' &&
            health.externalResultAuth === 'configured' &&
            health.publisherRepository === expectedRepositories[0] &&
            Array.isArray(health.publisherRepositories) &&
            health.publisherRepositories.length === expectedRepositories.length &&
            expectedRepositories.every((repository) => health.publisherRepositories.includes(repository))
              ? 0
              : 1
          );
          NODE
              then
                ready=1
                break
              fi
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/ai-review-health.json || true
            exit 1
          fi
          cat /tmp/ai-review-health.json
