name: AI Review Publisher Secret Sync

on:
  workflow_run:
    workflows:
      - Control Room CI / Deploy
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'prod')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AI_REVIEW_PUBLISH_GITHUB_TOKEN: ${{ secrets.AI_REVIEW_PUBLISH_GITHUB_TOKEN }}
      ORG_GITHUB_TOKEN: ${{ secrets.ORG_GITHUB_TOKEN }}
      AI_REVIEW_GATEWAY_TOKEN: ${{ secrets.AI_REVIEW_GATEWAY_TOKEN }}
    steps:
      - name: Checkout trusted prod
        uses: actions/checkout@v4
        with:
          ref: prod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Verify least-privilege publisher credential
        id: publisher_probe
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${AI_REVIEW_PUBLISH_GITHUB_TOKEN:-}" ]; then
            if [ "${GITHUB_EVENT_NAME}" = 'workflow_dispatch' ]; then
              echo '::error::AI_REVIEW_PUBLISH_GITHUB_TOKEN is required for a manual publisher migration run.'
              exit 1
            fi
            echo "::warning::AI_REVIEW_PUBLISH_GITHUB_TOKEN is not configured; preserving the existing Worker publisher secret."
            echo "publisher_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # V1 expectation: a fine-grained credential with only uichat-mira/mira-mobile
          # selected and Pull requests: write. No Organization permission is required.
          target_repo='uichat-mira/mira-mobile'
          target_pr='126'
          forbidden_repo='uichat-mira/control-room'
          forbidden_issue='15'

          create_response="$(
            curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${AI_REVIEW_PUBLISH_GITHUB_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${target_repo}/issues/${target_pr}/comments" \
              --data '{"body":"<!-- mira-ai-review:publisher-scope-probe -->\nTemporary publisher-scope probe. This comment will be deleted in the same job."}'
          )"
          target_comment_id="$(
            printf '%s' "$create_response" \
              | node -e "let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(String(JSON.parse(s).id)))"
          )"

          cleanup_target() {
            curl --silent --show-error \
              -X DELETE \
              -H "Authorization: Bearer ${AI_REVIEW_PUBLISH_GITHUB_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${target_repo}/issues/comments/${target_comment_id}" \
              --output /dev/null || true
          }
          trap cleanup_target EXIT

          curl --fail --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer ${AI_REVIEW_PUBLISH_GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${target_repo}/issues/comments/${target_comment_id}" \
            --data '{"body":"<!-- mira-ai-review:publisher-scope-probe -->\nPublisher-scope probe update succeeded; deletion follows."}' \
            --output /dev/null

          forbidden_body='/tmp/forbidden-publisher-probe.json'
          forbidden_status="$(
            curl --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${AI_REVIEW_PUBLISH_GITHUB_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${forbidden_repo}/issues/${forbidden_issue}/comments" \
              --data '{"body":"<!-- mira-ai-review:publisher-scope-probe-forbidden -->"}' \
              --output "$forbidden_body" \
              --write-out '%{http_code}'
          )"

          if [ "$forbidden_status" = '201' ]; then
            forbidden_comment_id="$(
              node -e "const fs=require('node:fs'); const r=JSON.parse(fs.readFileSync('${forbidden_body}','utf8')); process.stdout.write(String(r.id))"
            )"
            curl --silent --show-error \
              -X DELETE \
              -H "Authorization: Bearer ${AI_REVIEW_PUBLISH_GITHUB_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${forbidden_repo}/issues/comments/${forbidden_comment_id}" \
              --output /dev/null || true
            echo '::error::Publisher credential can write outside mira-mobile; refusing to sync it into the Worker.'
            exit 1
          fi

          if [ "$forbidden_status" != '403' ] && [ "$forbidden_status" != '404' ]; then
            echo "::error::Unexpected forbidden-repository probe status: ${forbidden_status}"
            exit 1
          fi

          cleanup_target
          trap - EXIT
          rm -f "$forbidden_body"
          echo 'Publisher credential proved Mobile write capability and Control Room write denial.'
          echo 'publisher_ready=true' >> "$GITHUB_OUTPUT"

      - name: Sync Worker publisher secret
        if: steps.publisher_probe.outputs.publisher_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${AI_REVIEW_PUBLISH_GITHUB_TOKEN:-}"

          printf '%s' "$AI_REVIEW_PUBLISH_GITHUB_TOKEN" \
            | npx wrangler secret put GITHUB_PUBLISH_TOKEN \
                --name uichat-mira-control-room

      - name: Sync Mobile caller secret
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ORG_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${AI_REVIEW_GATEWAY_TOKEN:-}"
          test -n "${GH_TOKEN:-}"

          gh secret set AI_REVIEW_GATEWAY_TOKEN \
            --repo uichat-mira/mira-mobile \
            --app actions \
            --body "$AI_REVIEW_GATEWAY_TOKEN"

          echo 'Mobile caller secret synchronized.'

      - name: Verify publisher health
        if: steps.publisher_probe.outputs.publisher_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error \
              https://uichat-mira-control-room.dangjingtao.workers.dev/api/v1/ai-review/health \
              --output /tmp/ai-review-health.json; then
              if node <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('/tmp/ai-review-health.json', 'utf8'));
          process.exit(
            health.publisherAuth === 'configured' &&
            health.callerAuth === 'configured' &&
            health.publisherRepository === 'uichat-mira/mira-mobile' ? 0 : 1
          );
          NODE
              then
                ready=1
                break
              fi
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/ai-review-health.json || true
            exit 1
          fi
          cat /tmp/ai-review-health.json
